# Long data uses extraction:reasoning = 8:2 (single:multi:reasoning = 4:4:2).
# weights are normalized token_weights / avg_len; recalculate for your corpus.
# Replace each source with a directory containing your parquet shards.
sources:
  - /path/to/data/extract_single
  - /path/to/data/extract_multi
  - /path/to/data/reasoning
  - /path/to/data/short_instructions
schedule:
  - schedule_type: const
    token_weights: [0.08, 0.08, 0.04, 0.8]
    avg_len: [83.26, 83.31, 83.26, 1.26]
    weights: [0.0015076292, 0.0015067244, 0.0007538146, 0.9962318318]
names:
  - extract_sp
  - extract_mp
  - math_ap
  - llavaov_sft
