# MMProLong backbone-transfer entry; native Qwen3-VL model configuration is unchanged.
model:
  model_path: Qwen/Qwen3-VL-8B-Instruct
  tokenizer_path: Qwen/Qwen3-VL-8B-Instruct
  attn_implementation: flash_attention_2

data:
  train_path: scripts/qwen_vl_mix_yaml/long_doc_vqa_8_2.yaml
  data_type: conversation
  chat_template: qwen3vl
  dataloader_type: native
  datasets_type: iterable
  enable_multisource: true
  max_seq_len: 131072
  train_size: 5_000_000_000
  num_workers: 1
  prefetch_factor: 2
  shuffle_buffer_size: 1
  mm_configs:
    fps: 2.0
    use_audio_in_video: false

train:
  output_dir: outputs/qwen3_vl_8b_128k
  num_train_epochs: 1
  micro_batch_size: 1
  global_batch_size: 32
  optimizer: adamw
  lr: 1.0e-5
  vit_lr: 1.0e-6  # Existing trainer default; retained explicitly.
  lr_min: 1.0e-6
  lr_decay_style: cosine
  lr_warmup_ratio: 0.1
  weight_decay: 0.1
  freeze_vit: false
  data_parallel_mode: fsdp2
  data_parallel_replicate_size: -1
  data_parallel_shard_size: 4
  ulysses_parallel_size: 2
  init_device: meta
  enable_reentrant: false
  enable_gradient_checkpointing: true
  rmpad: false
  rmpad_with_pos_ids: true
  dyn_bsz_buffer_size: 10
  train_log_steps: 3
  save_steps: 50
  gc_steps: 25
  empty_cache_steps: 50
  ckpt_manager: dcp
  save_hf_weights: false
  use_wandb: false  # Opt in with --train.use_wandb true.
  wandb_project: qwen3_vl_long_context
  wandb_name: mmprolong
  load_checkpoint_path: auto
